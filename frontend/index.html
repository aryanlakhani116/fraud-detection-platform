<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fraud Detection Demo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Transaction Risk Check</h1>

    <form id="predict-form">
      <label for="amount">Transaction Amount ($)</label>
      <input type="number" id="amount" step="0.01" min="0.01" required value="125.50" />

      <label for="product">Product Code</label>
      <select id="product">
        <option value="W">W</option>
        <option value="C">C</option>
        <option value="R">R</option>
      </select>

      <label for="model-choice">Model</label>
      <select id="model-choice">
        <option value="xgboost">XGBoost</option>
        <option value="ann">PyTorch ANN</option>
      </select>

      <button type="submit">Check Transaction</button>
    </form>

    <div id="result" hidden></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
